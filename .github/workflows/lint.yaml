name: Lint

on:
  schedule:
    - cron: '17 18 * * *' # 03:17 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-textlint
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check for changed inputs
        id: inputs
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 .github/scripts/nightly-lint.py prepare

      - name: Setup Node
        if: steps.inputs.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: '24.x'

      - name: Install dependencies
        if: steps.inputs.outputs.run == 'true'
        run: |
          npm install --global npm@11.18.0
          npm ci

      - name: Run textlint and update report
        if: steps.inputs.outputs.run == 'true'
        env:
          INPUT_HASH: ${{ steps.inputs.outputs.hash }}
        run: python3 .github/scripts/nightly-lint.py report
